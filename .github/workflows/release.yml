name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev libglib2.0-dev \
            libpcap-dev

      - name: Install Wails3
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.31
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build
        run: wails3 build

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=$(cat <<'EOF'
          Linux pre-release.

          - Day history: pick a saved day from the Devices header to see that day read-only
          - Day totals accumulate across saves and roll over at local midnight
          - Device usage, names, blocks, and rate limits survive an unreachable → reachable cycle
          - New app and tray icons
          EOF
          )
          gh release create "$GITHUB_REF_NAME" bin/fmmon \
            --prerelease \
            --title "$GITHUB_REF_NAME linux" \
            --notes "$notes"
